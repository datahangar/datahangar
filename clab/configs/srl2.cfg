/ interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.2.0.1/30
        }
        admin-state enable
    }
}

/ interface ethernet-1/10 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 192.0.2.2/30
        }
        admin-state enable
    }
}

/ routing-policy {
    policy loopbacks-policy {
        statement 1 {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
    }
}

/ network-instance default {
    protocols {
        bgp {
            router-id 2.2.2.2
            autonomous-system 65001
            afi-safi ipv4-unicast {
                admin-state enable
            }
            group lab {
                export-policy loopbacks-policy
                import-policy loopbacks-policy
            }
            neighbor 192.0.2.1 {
                admin-state enable
                peer-group lab
                peer-as 65001
            }
        }
    }
}
